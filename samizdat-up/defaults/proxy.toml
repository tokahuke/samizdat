# Default samizdat-proxy config written by samizdat-up. Edit and
# `systemctl restart samizdat-proxy` to apply changes. samizdat-up will
# not overwrite this file on a reinstall.
#
# The [dns] block is mandatory: the proxy serves only host-form
# (`<sub>.<wildcard_root>`). For a public HTTPS proxy, set `https =
# true`, fill in `owner` (Let's Encrypt contact email), and configure
# the provider's credentials in /etc/samizdat/proxy.env.

data = "/var/lib/samizdat/proxy"
target_node = "http://localhost:4510"

https = false
owner = "you@example.org"

[dns]
zone = "your-zone.example"
wildcard_root = "proxy.your-zone.example"
provider = "digitalocean"
# token_env = "DIGITALOCEAN_TOKEN"  # default; override only if you need a custom env-var name
