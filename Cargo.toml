[workspace]

members = [
    "common",
    "node",
    "hub",
    "cli",
    "proxy",
    "pinner",
    "samizdat-up",
]
resolver = "2"

[workspace.package]
version = "0.3.3"
authors = ["Pedro B Arruda <pedrobittencourt3@gmail.com>"]
edition = "2024"

[profile.release]

opt-level = "s"
lto = "fat"

[workspace.lints.clippy]
# Pedantic checks on at workspace scope so `cargo clippy --workspace`
# (no extra flags) is the canonical sweep. Individual lints below
# turn off the high-volume / low-signal ones so the warnings that
# remain are the actionable ones. If any of these starts to catch
# real bugs in the future, lift it back to warn.
#
# `priority = -1` means "group default; individual lints override."
pedantic = { level = "warn", priority = -1 }
use_self = "allow"
doc_markdown = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
semicolon_if_nothing_returned = "allow"
uninlined_format_args = "allow"
items_after_statements = "allow"
redundant_pub_crate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
ignored_unit_patterns = "allow"
significant_drop_tightening = "allow"
# Cosmetic / stylistic; the codebase has a consistent house style and
# clippy's rewrite suggestions here are not improvements.
collapsible_if = "allow"
redundant_closure_for_method_calls = "allow"
if_not_else = "allow"
duration_suboptimal_units = "allow"
redundant_else = "allow"
match_same_arms = "allow"
unused_async = "allow"
unnecessary_trailing_comma = "allow"
match_wildcard_for_single_variants = "allow"
bool_to_int_with_if = "allow"
single_match_else = "allow"
wildcard_imports = "allow"
ref_option = "allow"
needless_return = "allow"
return_self_not_must_use = "allow"
explicit_iter_loop = "allow"
format_collect = "allow"
needless_raw_string_hashes = "allow"
needless_borrows_for_generic_args = "allow"
inline_always = "allow"
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
iter_kv_map = "allow"
iter_cloned_collect = "allow"
needless_option_take = "allow"
new_without_default = "allow"
result_large_err = "allow"
unbuffered_bytes = "allow"
manual_assert = "allow"
unused_self = "allow"
too_long_first_doc_paragraph = "allow"
unnested_or_patterns = "allow"
# `.map(f).unwrap_or(...)` reads more naturally than `.map_or(...)`
# in many of our error-context formatters; not worth churning.
map_unwrap_or = "allow"
# Cast-with-bounds-check sites in identity_dapp etc.; the surrounding
# `.min(i64::MAX as u64)` already guarantees no wrap.
cast_possible_wrap = "allow"
# Tests / dev branches sometimes legitimately keep identical blocks
# for readability; flag at the site when it's a real bug.
if_same_then_else = "allow"
# Time arithmetic with `Instant::now()` operands is bounded by
# wallclock semantics; theoretical panic isn't worth a `checked_sub`.
unchecked_time_subtraction = "allow"
